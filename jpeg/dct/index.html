<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEG DCT Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F5F5F7;
            color: #1D1D1F;
        }

        .apple-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        .basis-wrapper {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .basis-active {
            transform: scale(1.3);
            z-index: 20;
            box-shadow: 0 8px 16px rgba(0, 113, 227, 0.3);
            border-radius: 4px;
            outline: 3px solid #0071E3;
            opacity: 1 !important;
        }

        .basis-processed {
            opacity: 0.15;
            transform: scale(0.9);
        }

        .basis-pending {
            opacity: 1;
        }

        #signalDescription:empty,
        #basisDescription:empty,
        #uploadStatus:empty {
            display: none;
        }

        #signalCanvas {
            image-rendering: pixelated;
        }

        /* Apple-style range slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            margin-top: -8px;
            border: 1px solid #d1d1d6;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #E5E5EA;
            border-radius: 3px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="max-w-5xl w-full mx-auto space-y-6">

        <!-- Main Workspace -->
        <div class="flex flex-col md:flex-row gap-6 md:gap-8 items-start">

            <!-- Left Column: Signal -->
            <div class="apple-card rounded-3xl p-6 md:p-8 w-full md:w-1/2 flex flex-col items-center">
                <div class="flex flex-wrap gap-3 justify-between w-full items-center mb-6">
                    <h2 class="text-xl font-medium" id="signalTitle">Image Signal</h2>

                    <div class="relative">
                        <select id="imageSelect" aria-label="Image source" class="appearance-none bg-gray-100 hover:bg-gray-200 text-sm font-medium rounded-full py-1.5 pl-4 pr-8 transition cursor-pointer outline-none">
                            <option value="edge">Pattern: Edge</option>
                            <option value="gradient">Pattern: Gradient</option>
                            <option value="checker">Pattern: High Freq</option>
                            <option value="custom" hidden>Custom Image</option>
                            <option value="upload">Upload Custom...</option>
                        </select>
                        <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        <input type="file" id="fileInput" accept="image/*" class="hidden">
                    </div>
                </div>

                <div class="relative w-full aspect-square max-w-[320px] bg-gray-100 rounded-xl overflow-hidden shadow-inner">
                    <canvas id="signalCanvas" width="256" height="256" class="w-full h-full object-contain"></canvas>
                </div>

                <p id="uploadStatus" role="status" class="text-sm text-[#86868B] mt-3 text-center"></p>
                <p id="signalDescription" class="text-sm text-[#86868B] mt-6 text-center h-10"></p>

                <!-- Mode Toggle -->
                <div class="bg-gray-100 p-1 rounded-full flex w-full max-w-[240px] mt-2 relative">
                    <button id="btnSubtract" class="flex-1 text-xs py-1.5 rounded-full font-medium shadow bg-white text-gray-900 transition-all z-10">Subtracting</button>
                    <button id="btnAdd" class="flex-1 text-xs py-1.5 rounded-full font-medium text-gray-500 hover:text-gray-900 transition-all z-10">Reconstructing</button>
                </div>
            </div>

            <!-- Right Column: Basis Map -->
            <div class="apple-card rounded-3xl p-6 md:p-8 w-full md:w-1/2 flex flex-col items-center">
                <div class="flex justify-between w-full items-center mb-6">
                    <h2 class="text-xl font-medium">DCT Basis Map</h2>
                    <span id="currentFreq" class="text-sm font-medium text-[#0071E3] bg-blue-50 px-3 py-1 rounded-full">Freq: u=0, v=0</span>
                </div>

                <div id="basisGrid" class="grid grid-cols-8 gap-1 w-full aspect-square max-w-[320px]">
                    <!-- Canvas elements injected via JS -->
                </div>

                <p id="basisDescription" class="text-sm text-[#86868B] mt-6 text-center">
                    64 basis functions in zigzag order (Low to High Frequencies).
                </p>
            </div>
        </div>

        <!-- Controls -->
        <div class="apple-card rounded-3xl p-6 w-full flex flex-col md:flex-row items-center gap-6">
            <button id="playBtn" aria-label="Play animation" class="w-12 h-12 flex-shrink-0 flex items-center justify-center bg-gray-900 text-white rounded-full hover:scale-105 transition transform shadow-md">
                <svg id="playIcon" class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <div class="flex-grow w-full flex flex-col gap-2">
                <input type="range" id="stepSlider" aria-label="Frequency step" min="0" max="64" value="0" class="w-full">
                <div class="flex justify-between text-xs text-[#86868B] font-medium uppercase tracking-wider">
                    <span id="startLabel">Original Signal</span>
                    <span>Step <span id="stepLabel" class="text-gray-900">0</span> / 64</span>
                    <span id="endLabel">Flat Residual</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Standard JPEG Zigzag ordering mapping linear index (0-63) to [u, v]
        const ZIGZAG = [
            [0,0], [1,0], [0,1], [0,2], [1,1], [2,0], [3,0], [2,1],
            [1,2], [0,3], [0,4], [1,3], [2,2], [3,1], [4,0], [5,0],
            [4,1], [3,2], [2,3], [1,4], [0,5], [0,6], [1,5], [2,4],
            [3,3], [4,2], [5,1], [6,0], [7,0], [6,1], [5,2], [4,3],
            [3,4], [2,5], [1,6], [0,7], [1,7], [2,6], [3,5], [4,4],
            [5,3], [6,2], [7,1], [7,2], [6,3], [5,4], [4,5], [3,6],
            [2,7], [3,7], [4,6], [5,5], [6,4], [7,3], [7,4], [6,5],
            [5,6], [4,7], [5,7], [6,6], [7,5], [7,6], [6,7], [7,7]
        ];

        const MAX_IMAGE_DIMENSION = 256;
        const BLOCK_SIZE = 8;
        const CHANNELS = 3;
        const BLOCK_VALUES = 64 * CHANNELS;

        // RGB values are interleaved within each block; coefficients use zigzag order.
        const state = {
            step: 0,
            isPlaying: false,
            mode: 'subtract', // 'subtract' or 'add'
            source: 'edge',
            width: 8,
            height: 8,
            blocksAcross: 1,
            blocksDown: 1,
            originalData: new Float32Array(BLOCK_VALUES),
            coeffs: new Float64Array(BLOCK_VALUES),
            accumulated: new Float64Array(BLOCK_VALUES),
            accumulatedStep: 0,
            animationId: null,
            renderRequest: null,
            uploadVersion: 0
        };

        // DOM Elements
        const DOM = {
            signalCanvas: document.getElementById('signalCanvas'),
            basisGrid: document.getElementById('basisGrid'),
            slider: document.getElementById('stepSlider'),
            playBtn: document.getElementById('playBtn'),
            playIcon: document.getElementById('playIcon'),
            pauseIcon: document.getElementById('pauseIcon'),
            stepLabel: document.getElementById('stepLabel'),
            currentFreq: document.getElementById('currentFreq'),
            imageSelect: document.getElementById('imageSelect'),
            fileInput: document.getElementById('fileInput'),
            btnSubtract: document.getElementById('btnSubtract'),
            btnAdd: document.getElementById('btnAdd'),
            signalTitle: document.getElementById('signalTitle'),
            signalDescription: document.getElementById('signalDescription'),
            uploadStatus: document.getElementById('uploadStatus'),
            basisDescription: document.getElementById('basisDescription'),
            startLabel: document.getElementById('startLabel'),
            endLabel: document.getElementById('endLabel')
        };

        const ctxSignal = DOM.signalCanvas.getContext('2d');
        const pixelCanvas = document.createElement('canvas');
        const pixelContext = pixelCanvas.getContext('2d');
        let renderedPixels;
        const basisElements = [];

        // Precompute Cosine lookup table for performance
        const cosCache = new Float64Array(8 * 8);
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                cosCache[i * 8 + j] = Math.cos(((2 * i + 1) * j * Math.PI) / 16);
            }
        }
        function getCos(val, freq) { return cosCache[val * 8 + freq]; }
        function alpha(x) { return x === 0 ? 1 / Math.sqrt(2) : 1; }

        // The same normalized spatial basis serves every block and RGB channel.
        const spatialBasis = ZIGZAG.map(([u, v]) => {
            const values = new Float64Array(64);
            const scale = 0.25 * alpha(u) * alpha(v);
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    values[y * 8 + x] = scale * getCos(x, u) * getCos(y, v);
                }
            }
            return values;
        });

        // Example Patterns Generators
        const patterns = {
            'edge': (x, y) => (x + y < 8 ? 240 : 20),
            'gradient': (x, y) => (x * 16 + y * 16),
            'checker': (x, y) => ((x + y) % 2 === 0 ? 240 : 20)
        };

        function initBasisMap() {
            DOM.basisGrid.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const u = ZIGZAG[i][0];
                const v = ZIGZAG[i][1];

                const wrapper = document.createElement('div');
                wrapper.className = 'basis-wrapper basis-pending bg-white rounded-sm';

                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                canvas.className = 'w-full h-full object-contain';

                drawBasisFunction(canvas.getContext('2d'), u, v);

                wrapper.appendChild(canvas);
                DOM.basisGrid.appendChild(wrapper);
                basisElements.push(wrapper);
            }
        }

        function drawBasisFunction(ctx, u, v) {
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const val = getCos(x, u) * getCos(y, v);
                    // Map -1..1 to 0..255
                    const color = Math.max(0, Math.min(255, Math.round((val + 1) * 127.5)));
                    ctx.fillStyle = `rgb(${color},${color},${color})`;
                    ctx.fillRect(x * 4, y * 4, 4, 4);
                }
            }
        }

        function loadImageData(imageData, source) {
            pause();
            state.width = imageData.width;
            state.height = imageData.height;
            state.source = source;
            state.blocksAcross = Math.ceil(state.width / BLOCK_SIZE);
            state.blocksDown = Math.ceil(state.height / BLOCK_SIZE);
            const valueCount = state.blocksAcross * state.blocksDown * BLOCK_VALUES;
            state.originalData = new Float32Array(valueCount);
            state.coeffs = new Float64Array(valueCount);
            state.accumulated = new Float64Array(valueCount);
            state.accumulatedStep = 0;

            for (let by = 0; by < state.blocksDown; by++) {
                for (let bx = 0; bx < state.blocksAcross; bx++) {
                    const blockOffset = (by * state.blocksAcross + bx) * BLOCK_VALUES;
                    for (let y = 0; y < 8; y++) {
                        for (let x = 0; x < 8; x++) {
                            // Repeat edge pixels for partial blocks; display only the original extent.
                            const sx = Math.min(bx * 8 + x, state.width - 1);
                            const sy = Math.min(by * 8 + y, state.height - 1);
                            const src = (sy * state.width + sx) * 4;
                            const dst = blockOffset + (y * 8 + x) * CHANNELS;
                            for (let c = 0; c < CHANNELS; c++) {
                                state.originalData[dst + c] = imageData.data[src + c];
                            }
                        }
                    }
                }
            }

            computeDCT();
            pixelCanvas.width = state.width;
            pixelCanvas.height = state.height;
            renderedPixels = pixelContext.createImageData(state.width, state.height);
            const displayScale = source === 'custom' ? 1 : 32;
            DOM.signalCanvas.width = state.width * displayScale;
            DOM.signalCanvas.height = state.height * displayScale;
            state.step = 0;
            DOM.imageSelect.value = source;
            DOM.uploadStatus.textContent = '';
            DOM.basisDescription.textContent = source === 'custom'
                ? ''
                : '64 basis functions in zigzag order (Low to High Frequencies).';
            updateVisualization();
        }

        function computeDCT() {
            for (let block = 0; block < state.originalData.length; block += BLOCK_VALUES) {
                for (let i = 0; i < 64; i++) {
                    const basis = spatialBasis[i];
                    let r = 0, g = 0, b = 0;
                    for (let pixel = 0; pixel < 64; pixel++) {
                        const src = block + pixel * CHANNELS;
                        const weight = basis[pixel];
                        r += (state.originalData[src] - 128) * weight;
                        g += (state.originalData[src + 1] - 128) * weight;
                        b += (state.originalData[src + 2] - 128) * weight;
                    }
                    const dst = block + i * CHANNELS;
                    state.coeffs[dst] = r;
                    state.coeffs[dst + 1] = g;
                    state.coeffs[dst + 2] = b;
                }
            }
        }

        function accumulateToStep(step) {
            // Keep unclamped sums so reverse scrubbing and mode changes retain the signal.
            if (step === 0 || step < Math.abs(step - state.accumulatedStep)) {
                state.accumulated.fill(0);
                state.accumulatedStep = 0;
            }
            const direction = step >= state.accumulatedStep ? 1 : -1;
            const first = Math.min(step, state.accumulatedStep);
            const last = Math.max(step, state.accumulatedStep);
            for (let block = 0; block < state.coeffs.length; block += BLOCK_VALUES) {
                for (let i = first; i < last; i++) {
                    const basis = spatialBasis[i];
                    const src = block + i * CHANNELS;
                    const r = state.coeffs[src] * direction;
                    const g = state.coeffs[src + 1] * direction;
                    const b = state.coeffs[src + 2] * direction;
                    for (let pixel = 0; pixel < 64; pixel++) {
                        const dst = block + pixel * CHANNELS;
                        const weight = basis[pixel];
                        state.accumulated[dst] += r * weight;
                        state.accumulated[dst + 1] += g * weight;
                        state.accumulated[dst + 2] += b * weight;
                    }
                }
            }
            state.accumulatedStep = step;
        }

        function updateVisualization() {
            cancelAnimationFrame(state.renderRequest);
            state.renderRequest = null;
            const step = state.step;
            DOM.slider.value = step;
            DOM.stepLabel.textContent = step;
            accumulateToStep(step);
            renderSignalCanvas();
            DOM.startLabel.textContent = state.mode === 'subtract' ? 'Original Signal' : 'Flat Gray';
            DOM.endLabel.textContent = state.mode === 'subtract' ? 'Flat Residual' : 'Original Image';

            // Update UI Text
            if (state.mode === 'subtract') {
                DOM.signalTitle.textContent = step === 0 ? "Original Image" : "Transient Residual";
                DOM.signalDescription.textContent = "";
            } else {
                DOM.signalTitle.textContent = step === 64 ? "Reconstructed Image" : "Building Image";
                DOM.signalDescription.textContent = step === 0
                    ? ""
                    : step === 64 ? "All 64 components restored."
                    : `Adding frequency components cumulatively to build the image.`;
            }

            // Highlight Basis Grid
            if (step > 0 && step <= 64) {
                const currentU = ZIGZAG[step-1][0];
                const currentV = ZIGZAG[step-1][1];
                DOM.currentFreq.textContent = `Freq: u=${currentU}, v=${currentV}`;
            } else {
                DOM.currentFreq.textContent = `Standby`;
            }

            basisElements.forEach((el, i) => {
                el.className = 'basis-wrapper bg-white rounded-sm ' +
                    (i < step - 1 ? 'basis-processed' :
                     i === step - 1 ? 'basis-active' : 'basis-pending');
            });
        }

        function renderSignalCanvas() {
            const pixels = renderedPixels.data;
            for (let y = 0; y < state.height; y++) {
                for (let x = 0; x < state.width; x++) {
                    const block = Math.floor(y / 8) * state.blocksAcross + Math.floor(x / 8);
                    const src = block * BLOCK_VALUES + ((y % 8) * 8 + x % 8) * CHANNELS;
                    const dst = (y * state.width + x) * 4;
                    for (let c = 0; c < CHANNELS; c++) {
                        const value = state.mode === 'subtract'
                            ? state.originalData[src + c] - state.accumulated[src + c]
                            : 128 + state.accumulated[src + c];
                        pixels[dst + c] = Math.round(value); // ImageData clamps only the display.
                    }
                    pixels[dst + 3] = 255;
                }
            }
            pixelContext.putImageData(renderedPixels, 0, 0);
            ctxSignal.imageSmoothingEnabled = false;
            ctxSignal.drawImage(pixelCanvas, 0, 0, DOM.signalCanvas.width, DOM.signalCanvas.height);

            // Keep the enlarged pixel grid for the original single-block presets.
            if (state.source === 'custom') return;
            const blockSize = 32;
            ctxSignal.strokeStyle = 'rgba(0, 0, 0, 0.08)';
            ctxSignal.lineWidth = 1;
            for (let i = 1; i < 8; i++) {
                ctxSignal.beginPath(); ctxSignal.moveTo(i * blockSize, 0); ctxSignal.lineTo(i * blockSize, 256); ctxSignal.stroke();
                ctxSignal.beginPath(); ctxSignal.moveTo(0, i * blockSize); ctxSignal.lineTo(256, i * blockSize); ctxSignal.stroke();
            }
        }

        function loadPattern(patternName) {
            state.uploadVersion++;
            const gen = patterns[patternName];
            const imageData = new ImageData(8, 8);
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const offset = (y * 8 + x) * 4;
                    const value = gen(x, y);
                    imageData.data.set([value, value, value, 255], offset);
                }
            }
            loadImageData(imageData, patternName);
        }

        function togglePlay() {
            if (state.isPlaying) {
                pause();
            } else {
                if (state.step >= 64) {
                    state.step = 0;
                    updateVisualization();
                }
                state.isPlaying = true;
                DOM.playBtn.setAttribute('aria-label', 'Pause animation');
                DOM.playIcon.classList.add('hidden');
                DOM.pauseIcon.classList.remove('hidden');

                state.animationId = setInterval(() => {
                    if (state.step < 64) {
                        state.step++;
                        updateVisualization();
                        if (state.step === 64) pause();
                    } else {
                        pause();
                    }
                }, 250); // Speed of animation
            }
        }

        function pause() {
            state.isPlaying = false;
            clearInterval(state.animationId);
            DOM.playBtn.setAttribute('aria-label', 'Play animation');
            DOM.playIcon.classList.remove('hidden');
            DOM.pauseIcon.classList.add('hidden');
        }

        function setMode(mode) {
            state.mode = mode;
            if (mode === 'subtract') {
                DOM.btnSubtract.className = "flex-1 text-xs py-1.5 rounded-full font-medium shadow bg-white text-gray-900 transition-all z-10";
                DOM.btnAdd.className = "flex-1 text-xs py-1.5 rounded-full font-medium text-gray-500 hover:text-gray-900 transition-all z-10";
            } else {
                DOM.btnAdd.className = "flex-1 text-xs py-1.5 rounded-full font-medium shadow bg-white text-gray-900 transition-all z-10";
                DOM.btnSubtract.className = "flex-1 text-xs py-1.5 rounded-full font-medium text-gray-500 hover:text-gray-900 transition-all z-10";
            }
            updateVisualization();
        }

        async function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            // Reset after capturing the File so the same image can be selected again.
            DOM.fileInput.value = '';
            const version = ++state.uploadVersion;
            pause();
            DOM.uploadStatus.textContent = 'Loading image…';
            const url = URL.createObjectURL(file);
            try {
                const img = new Image();
                img.src = url;
                await img.decode();
                if (version !== state.uploadVersion) return;

                const scale = Math.min(1, MAX_IMAGE_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
                const width = Math.max(1, Math.round(img.naturalWidth * scale));
                const height = Math.max(1, Math.round(img.naturalHeight * scale));
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const context = tempCanvas.getContext('2d');
                // The visualization uses opaque RGB. Composite transparent uploads on white.
                context.fillStyle = '#fff';
                context.fillRect(0, 0, width, height);
                context.imageSmoothingEnabled = true;
                context.imageSmoothingQuality = 'high';
                context.drawImage(img, 0, 0, width, height);
                loadImageData(context.getImageData(0, 0, width, height), 'custom');
            } catch {
                if (version === state.uploadVersion) {
                    DOM.uploadStatus.textContent = 'Could not load this image. Try another file.';
                    DOM.imageSelect.value = state.source;
                }
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        // Bind Events
        DOM.slider.addEventListener('input', (e) => {
            state.step = parseInt(e.target.value);
            pause();
            // Coalesce rapid slider events into one render per browser frame.
            if (state.renderRequest === null) {
                state.renderRequest = requestAnimationFrame(updateVisualization);
            }
        });

        DOM.playBtn.addEventListener('click', togglePlay);

        DOM.btnSubtract.addEventListener('click', () => setMode('subtract'));
        DOM.btnAdd.addEventListener('click', () => setMode('add'));

        DOM.imageSelect.addEventListener('change', (e) => {
            if (e.target.value === 'upload') {
                // Upload is an action, allowing repeated uploads and leaving cancellation harmless.
                DOM.imageSelect.value = state.source;
                DOM.fileInput.click();
            } else if (e.target.value !== 'custom') {
                loadPattern(e.target.value);
            }
        });

        DOM.fileInput.addEventListener('change', handleImageUpload);

        initBasisMap();
        loadPattern('edge'); // Load default

    </script>
</body>
</html>
