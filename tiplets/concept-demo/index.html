<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TipLets Interactive Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling on desktop */
        }

        /* Custom styles for the interactive area */
        #simulation-container {
            position: relative;
            cursor: crosshair;
            background-color: #fafafa; /* zinc-50 equivalent */
            background-image: radial-gradient(#e4e4e7 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Custom toggle switch styling - Shadcn style */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #09090b;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #09090b;
        }

        @media (prefers-reduced-motion: reduce) {
            .header-transition {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-white text-zinc-950">

    <main id="simulation-container" class="relative h-full w-full touch-none">
        <canvas id="trail-canvas" class="absolute inset-0 w-full h-full pointer-events-none" aria-hidden="true"></canvas>
        <canvas id="env-canvas" class="absolute inset-0 w-full h-full"></canvas>

        <!-- Floating identity and telemetry island -->
        <header id="header-island" class="absolute top-4 md:top-6 left-1/2 -translate-x-1/2 z-20 w-[calc(100%-2rem)] max-w-xl pointer-events-none">
            <div class="rounded-2xl border border-white/80 ring-1 ring-zinc-200/80 bg-white/90 backdrop-blur-md px-5 py-3.5 shadow-[0_16px_40px_-20px_rgba(9,9,11,0.45)]">
                <div class="flex flex-col sm:flex-row sm:items-center sm:gap-4">
                    <h1 class="text-lg font-semibold tracking-tight text-zinc-950 whitespace-nowrap">TipLets Demo</h1>
                    <span class="hidden sm:block h-7 w-px bg-zinc-200" aria-hidden="true"></span>
                    <div class="relative mt-0.5 h-10 w-full overflow-hidden sm:mt-0 sm:h-8 sm:min-w-0 sm:flex-1">
                        <p id="header-description" class="header-transition absolute inset-0 flex items-center text-xs sm:text-sm leading-relaxed text-zinc-500 transition-all duration-500 ease-out">
                            Move your cursor over the canvas to explore hidden shapes.
                        </p>
                        <div id="header-intensity" class="header-transition absolute inset-0 flex items-center gap-3 opacity-0 translate-y-2 transition-all duration-500 ease-out" aria-hidden="true">
                            <div class="shrink-0 leading-none">
                                <span class="block text-[9px] font-semibold uppercase tracking-[0.14em] text-zinc-400">Peak</span>
                                <span id="motor-intensity" class="mt-1 block font-mono text-sm font-medium text-zinc-400">0%</span>
                            </div>
                            <div class="grid h-7 min-w-0 flex-1 grid-cols-6 gap-1" aria-label="Individual motor intensity levels">
                                <div class="flex items-end overflow-hidden rounded-[3px] bg-zinc-100"><span data-motor-level="1" class="block h-0 w-full bg-zinc-950"></span></div>
                                <div class="flex items-end overflow-hidden rounded-[3px] bg-zinc-100"><span data-motor-level="2" class="block h-0 w-full bg-zinc-950"></span></div>
                                <div class="flex items-end overflow-hidden rounded-[3px] bg-zinc-100"><span data-motor-level="3" class="block h-0 w-full bg-zinc-950"></span></div>
                                <div class="flex items-end overflow-hidden rounded-[3px] bg-zinc-100"><span data-motor-level="4" class="block h-0 w-full bg-zinc-950"></span></div>
                                <div class="flex items-end overflow-hidden rounded-[3px] bg-zinc-100"><span data-motor-level="5" class="block h-0 w-full bg-zinc-950"></span></div>
                                <div class="flex items-end overflow-hidden rounded-[3px] bg-zinc-100"><span data-motor-level="6" class="block h-0 w-full bg-zinc-950"></span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Instructional Overlay (Fades out on interaction) -->
        <div id="instructions" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-700">
            <div class="bg-white/95 backdrop-blur-sm px-6 py-5 rounded-xl border border-zinc-200 text-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-3 text-zinc-900 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                </svg>
                <p class="font-semibold text-zinc-900">Move cursor to explore</p>
                <p class="text-sm text-zinc-500 mt-1">Touch or mouse</p>
            </div>
        </div>

        <!-- Floating control island -->
        <footer id="control-island" class="absolute bottom-4 md:bottom-6 left-1/2 -translate-x-1/2 z-20 w-[calc(100%-2rem)] max-w-5xl">
            <div class="rounded-2xl border border-white/80 ring-1 ring-zinc-200/80 bg-white/90 backdrop-blur-md p-3 shadow-[0_16px_40px_-20px_rgba(9,9,11,0.45)] md:px-4">
                <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:gap-4">
                    <fieldset class="min-w-0 flex-1">
                        <legend class="mb-1.5 text-[10px] font-semibold uppercase tracking-[0.14em] text-zinc-400 lg:sr-only">Target stimulus</legend>
                        <div class="grid grid-cols-4 gap-1 rounded-xl bg-zinc-100 p-1">
                            <button type="button" onclick="setShape('square')" id="btn-square" class="shape-btn rounded-lg border border-transparent bg-transparent px-2 py-2 text-xs font-medium text-zinc-600 transition-all hover:bg-white hover:text-zinc-950 focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-1">Square</button>
                            <button type="button" onclick="setShape('circle')" id="btn-circle" class="shape-btn rounded-lg border border-transparent bg-zinc-950 px-2 py-2 text-xs font-medium text-white shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-1">Circle</button>
                            <button type="button" onclick="setShape('triangle')" id="btn-triangle" class="shape-btn rounded-lg border border-transparent bg-transparent px-2 py-2 text-xs font-medium text-zinc-600 transition-all hover:bg-white hover:text-zinc-950 focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-1">Triangle</button>
                            <button type="button" onclick="setShape('star')" id="btn-star" class="shape-btn rounded-lg border border-transparent bg-transparent px-2 py-2 text-xs font-medium text-zinc-600 transition-all hover:bg-white hover:text-zinc-950 focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-1">Star</button>
                        </div>
                    </fieldset>

                    <span class="hidden h-8 w-px bg-zinc-200 lg:block" aria-hidden="true"></span>

                    <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:flex lg:shrink-0 lg:items-center">
                        <label id="trail-control" for="trail-toggle" class="flex cursor-pointer items-center justify-between gap-2 rounded-xl px-1 py-2 text-sm font-medium text-zinc-700 transition-all hover:bg-zinc-100 sm:gap-3 sm:px-2">
                            <span class="whitespace-nowrap sm:hidden">Trail</span>
                            <span class="hidden whitespace-nowrap sm:inline">Show Trail</span>
                            <span class="relative inline-block w-10 shrink-0 select-none align-middle">
                                <input type="checkbox" name="trail" id="trail-toggle" class="toggle-checkbox absolute z-10 block h-5 w-5 appearance-none rounded-full border-2 border-zinc-200 bg-white cursor-pointer transition-all duration-200 ease-in-out" checked/>
                                <span class="toggle-label block h-5 overflow-hidden rounded-full bg-zinc-200 transition-colors duration-200 ease-in-out"></span>
                            </span>
                        </label>

                        <label for="truth-toggle" class="flex cursor-pointer items-center justify-between gap-2 rounded-xl px-1 py-2 text-sm font-medium text-zinc-700 transition-colors hover:bg-zinc-100 sm:gap-3 sm:px-2">
                            <span class="whitespace-nowrap sm:hidden">Truth</span>
                            <span class="hidden whitespace-nowrap sm:inline">Show Ground Truth</span>
                            <span class="relative inline-block w-10 shrink-0 select-none align-middle">
                                <input type="checkbox" name="truth" id="truth-toggle" class="toggle-checkbox absolute z-10 block h-5 w-5 appearance-none rounded-full border-2 border-zinc-200 bg-white cursor-pointer transition-all duration-200 ease-in-out"/>
                                <span class="toggle-label block h-5 overflow-hidden rounded-full bg-zinc-200 transition-colors duration-200 ease-in-out"></span>
                            </span>
                        </label>

                        <button type="button" onclick="randomizeTransform()" class="col-span-2 flex w-full items-center justify-center gap-1.5 whitespace-nowrap rounded-xl bg-zinc-950 px-3 py-2.5 text-sm font-medium text-white shadow-sm transition-all hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2 sm:col-span-1 sm:gap-2 sm:px-3.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                            <span>Randomize <span class="hidden sm:inline">Position</span></span>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </main>

    <script>
        const trailCanvas = document.getElementById('trail-canvas');
        const trailCtx = trailCanvas.getContext('2d');
        const canvas = document.getElementById('env-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('simulation-container');
        const intensityEl = document.getElementById('motor-intensity');
        const motorLevelEls = [...document.querySelectorAll('[data-motor-level]')];
        const instructionsEl = document.getElementById('instructions');
        const headerIslandEl = document.getElementById('header-island');
        const headerDescriptionEl = document.getElementById('header-description');
        const headerIntensityEl = document.getElementById('header-intensity');
        const controlIslandEl = document.getElementById('control-island');
        const trailToggleEl = document.getElementById('trail-toggle');
        const trailControlEl = document.getElementById('trail-control');
        const truthToggleEl = document.getElementById('truth-toggle');

        // Simulation State
        let state = {
            shape: 'circle',
            showTruth: false,
            showTrail: true,
            hasInteracted: false,
            // Shape transformation data
            targetX: 0,
            targetY: 0,
            scale: 1,
            rotation: 0,
            // Physics / Input
            mouseX: window.innerWidth / 2,
            mouseY: window.innerHeight / 2,
            handX: window.innerWidth / 2,
            handY: window.innerHeight / 2,
        };

        // TipLet Configuration (6 dots, standard Braille layout proportions)
        const TIPLET_CONFIG = {
            dotRadius: 4,
            spacingX: 18,
            spacingY: 22,
            easing: 0.15, // Lower = more "lag" / weight to the hand
            outlinePadding: 16,
            falloffRadius: 28,
            intensitySmoothing: 0.22,
            vibrationAmplitude: 2.5
        };

        // Generate the relative positions of the 6 motors from the center of the fingertip
        const motors = [
            { id: 1, dx: -TIPLET_CONFIG.spacingX/2, dy: -TIPLET_CONFIG.spacingY, intensity: 0 },
            { id: 2, dx: -TIPLET_CONFIG.spacingX/2, dy: 0, intensity: 0 },
            { id: 3, dx: -TIPLET_CONFIG.spacingX/2, dy: TIPLET_CONFIG.spacingY, intensity: 0 },
            { id: 4, dx: TIPLET_CONFIG.spacingX/2,  dy: -TIPLET_CONFIG.spacingY, intensity: 0 },
            { id: 5, dx: TIPLET_CONFIG.spacingX/2,  dy: 0, intensity: 0 },
            { id: 6, dx: TIPLET_CONFIG.spacingX/2,  dy: TIPLET_CONFIG.spacingY, intensity: 0 }
        ];

        let currentPath = new Path2D();

        function clampToRange(value, minimum, maximum, fallback) {
            if (minimum > maximum) return fallback;
            return Math.max(minimum, Math.min(value, maximum));
        }

        function getSafeBounds(containerRect, shapeRadius) {
            const headerRect = headerIslandEl.getBoundingClientRect();
            const footerRect = controlIslandEl.getBoundingClientRect();

            return {
                minimumX: shapeRadius + 24,
                maximumX: containerRect.width - shapeRadius - 24,
                minimumY: headerRect.bottom - containerRect.top + shapeRadius + 24,
                maximumY: footerRect.top - containerRect.top - shapeRadius - 24
            };
        }

        function resetTrailTracking() {
            motors.forEach(motor => {
                motor.trailX = null;
                motor.trailY = null;
                motor.trailIntensity = 0;
            });
        }

        function clearTrail() {
            trailCtx.save();
            trailCtx.setTransform(1, 0, 0, 1, 0, 0);
            trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
            trailCtx.restore();
            resetTrailTracking();
        }

        function resizeCanvas() {
            // High DPI display support for crisp rendering
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();

            trailCanvas.width = rect.width * dpr;
            trailCanvas.height = rect.height * dpr;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            trailCtx.scale(dpr, dpr);
            ctx.scale(dpr, dpr);
            trailCanvas.style.width = `${rect.width}px`;
            trailCanvas.style.height = `${rect.height}px`;
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            resetTrailTracking();

            const shapeRadius = 75 * state.scale;
            const { minimumX, maximumX, minimumY, maximumY } = getSafeBounds(
                rect,
                shapeRadius
            );

            // Center the initial stimulus within the space between both islands.
            if(state.targetX === 0) {
                state.targetX = rect.width / 2;
                state.targetY = clampToRange(
                    rect.height / 2,
                    minimumY,
                    maximumY,
                    rect.height / 2
                );
                state.mouseX = rect.width / 2;
                state.mouseY = state.targetY;
                state.handX = rect.width / 2;
                state.handY = state.targetY;
            } else {
                // Keep the stimulus and hand reachable after responsive resizes.
                state.targetX = clampToRange(state.targetX, minimumX, maximumX, rect.width / 2);
                state.targetY = clampToRange(state.targetY, minimumY, maximumY, rect.height / 2);
                state.mouseX = clampToRange(state.mouseX, 0, rect.width, rect.width / 2);
                state.mouseY = clampToRange(state.mouseY, 0, rect.height, rect.height / 2);
                state.handX = clampToRange(state.handX, 0, rect.width, rect.width / 2);
                state.handY = clampToRange(state.handY, 0, rect.height, rect.height / 2);
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // Input Tracking (Mouse & Touch)
        function updateMousePos(x, y) {
            const rect = canvas.getBoundingClientRect();
            state.mouseX = x - rect.left;
            state.mouseY = y - rect.top;

            if (!state.hasInteracted) {
                state.hasInteracted = true;
                instructionsEl.style.opacity = '0';
            }
        }

        container.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
        container.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
            updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        container.addEventListener('mousedown', (e) => updateMousePos(e.clientX, e.clientY));
        container.addEventListener('touchstart', (e) => {
            updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        // Footer controls should not move the simulated fingertip underneath them.
        ['mousemove', 'mousedown', 'touchmove', 'touchstart'].forEach(eventName => {
            controlIslandEl.addEventListener(eventName, event => event.stopPropagation());
        });

        function getPolygonVertices(shape, baseSize) {
            const halfSize = baseSize / 2;

            if (shape === 'square') {
                return [
                    { x: -halfSize, y: -halfSize },
                    { x: halfSize, y: -halfSize },
                    { x: halfSize, y: halfSize },
                    { x: -halfSize, y: halfSize }
                ];
            }

            if (shape === 'triangle') {
                return [
                    { x: 0, y: -halfSize },
                    { x: halfSize, y: halfSize },
                    { x: -halfSize, y: halfSize }
                ];
            }

            if (shape === 'star') {
                return Array.from({ length: 10 }, (_, index) => {
                    const radius = index % 2 === 0 ? halfSize : halfSize / 2;
                    const angle = -Math.PI / 2 + index * Math.PI / 5;
                    return {
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius
                    };
                });
            }

            return [];
        }

        function generatePath() {
            const path = new Path2D();
            const baseSize = 150 * state.scale; // Size of the object

            // We use math to draw shapes centered at 0,0. We will translate the context when drawing.
            if (state.shape === 'circle') {
                path.arc(0, 0, baseSize / 2, 0, Math.PI * 2);
                return path;
            }

            const vertices = getPolygonVertices(state.shape, baseSize);
            if (vertices.length > 0) {
                path.moveTo(vertices[0].x, vertices[0].y);
                vertices.slice(1).forEach(vertex => path.lineTo(vertex.x, vertex.y));
                path.closePath();
            }

            return path;
        }

        function pointToSegmentDistance(point, start, end) {
            const segmentX = end.x - start.x;
            const segmentY = end.y - start.y;
            const lengthSquared = segmentX * segmentX + segmentY * segmentY;

            if (lengthSquared === 0) {
                return Math.hypot(point.x - start.x, point.y - start.y);
            }

            const projection = (
                (point.x - start.x) * segmentX +
                (point.y - start.y) * segmentY
            ) / lengthSquared;
            const t = Math.max(0, Math.min(1, projection));
            const closestX = start.x + segmentX * t;
            const closestY = start.y + segmentY * t;

            return Math.hypot(point.x - closestX, point.y - closestY);
        }

        function distanceToShapeEdge(globalX, globalY) {
            const offsetX = globalX - state.targetX;
            const offsetY = globalY - state.targetY;
            const cos = Math.cos(state.rotation);
            const sin = Math.sin(state.rotation);
            const localPoint = {
                x: offsetX * cos + offsetY * sin,
                y: -offsetX * sin + offsetY * cos
            };
            const baseSize = 150 * state.scale;

            if (state.shape === 'circle') {
                return Math.abs(Math.hypot(localPoint.x, localPoint.y) - baseSize / 2);
            }

            const vertices = getPolygonVertices(state.shape, baseSize);
            return vertices.reduce((closestDistance, vertex, index) => {
                const nextVertex = vertices[(index + 1) % vertices.length];
                return Math.min(
                    closestDistance,
                    pointToSegmentDistance(localPoint, vertex, nextVertex)
                );
            }, Infinity);
        }

        function intensityAtPoint(globalX, globalY) {
            const distance = distanceToShapeEdge(globalX, globalY);
            const proximity = Math.max(0, 1 - distance / TIPLET_CONFIG.falloffRadius);

            // Smoothstep produces a gentle physical ramp at both ends of the range.
            return proximity * proximity * (3 - 2 * proximity);
        }

        function drawMotorTrail(motor, globalX, globalY) {
            const intensity = motor.intensity;
            const wasActive = motor.trailIntensity > 0.035;
            const hasPreviousPoint = Number.isFinite(motor.trailX) && Number.isFinite(motor.trailY);
            const startX = wasActive && hasPreviousPoint ? motor.trailX : globalX;
            const startY = wasActive && hasPreviousPoint ? motor.trailY : globalY;

            motor.trailX = globalX;
            motor.trailY = globalY;
            motor.trailIntensity = state.showTrail ? intensity : 0;

            if (!state.showTrail || intensity <= 0.035) return;

            const deltaX = globalX - startX;
            const deltaY = globalY - startY;
            const distance = Math.hypot(deltaX, deltaY);
            const steps = Math.min(24, Math.max(1, Math.ceil(distance / 2)));
            const pressure = Math.pow(intensity, 0.75);
            const grainCount = 1 + Math.floor(pressure * 3);

            trailCtx.save();
            trailCtx.lineCap = 'round';

            for (let step = 0; step <= steps; step++) {
                const progress = steps === 0 ? 1 : step / steps;
                const baseX = startX + deltaX * progress;
                const baseY = startY + deltaY * progress;

                for (let grain = 0; grain < grainCount; grain++) {
                    const jitterRadius = 3.5 - pressure;
                    const jitterX = (Math.random() - 0.5) * jitterRadius;
                    const jitterY = (Math.random() - 0.5) * jitterRadius;
                    const angle = (Math.random() - 0.5) * Math.PI;
                    const grainLength = 0.8 + Math.random() * (1.5 + pressure * 2);
                    const halfX = Math.cos(angle) * grainLength / 2;
                    const halfY = Math.sin(angle) * grainLength / 2;

                    trailCtx.beginPath();
                    trailCtx.moveTo(baseX + jitterX - halfX, baseY + jitterY - halfY);
                    trailCtx.lineTo(baseX + jitterX + halfX, baseY + jitterY + halfY);
                    trailCtx.lineWidth = 0.35 + Math.random() * (0.65 + pressure * 0.7);
                    trailCtx.strokeStyle = `rgba(63, 63, 70, ${0.018 + pressure * 0.05})`;
                    trailCtx.stroke();
                }
            }

            trailCtx.restore();
        }

        function setShape(shapeName) {
            state.shape = shapeName;

            const activeClasses = ['bg-zinc-950', 'text-white', 'shadow-sm'];
            const inactiveClasses = [
                'bg-transparent',
                'text-zinc-600',
                'hover:bg-white',
                'hover:text-zinc-950'
            ];

            // Update the segmented target control.
            document.querySelectorAll('.shape-btn').forEach(btn => {
                btn.classList.remove(...activeClasses);
                btn.classList.add(...inactiveClasses);
            });
            const activeBtn = document.getElementById(`btn-${shapeName}`);
            activeBtn.classList.remove(...inactiveClasses);
            activeBtn.classList.add(...activeClasses);

            currentPath = generatePath();
            clearTrail();
        }

        function randomizeTransform() {
            const rect = container.getBoundingClientRect();
            state.scale = 0.7 + Math.random() * 0.8; // Scale between 0.7 and 1.5
            const shapeRadius = 75 * state.scale;
            const { minimumX, maximumX, minimumY, maximumY } = getSafeBounds(
                rect,
                shapeRadius
            );

            state.targetX = minimumX < maximumX
                ? minimumX + Math.random() * (maximumX - minimumX)
                : rect.width / 2;
            state.targetY = minimumY < maximumY
                ? minimumY + Math.random() * (maximumY - minimumY)
                : rect.height / 2;
            state.rotation = (Math.random() - 0.5) * Math.PI; // Random rotation

            currentPath = generatePath();
            clearTrail();
        }

        function revealHeaderIntensity() {
            headerDescriptionEl.classList.add('opacity-0', '-translate-y-2');
            headerDescriptionEl.setAttribute('aria-hidden', 'true');
            headerIntensityEl.classList.remove('opacity-0', 'translate-y-2');
            headerIntensityEl.setAttribute('aria-hidden', 'false');
        }

        trailToggleEl.addEventListener('change', (event) => {
            state.showTrail = event.target.checked;
            if (!state.showTrail) clearTrail();
        });

        truthToggleEl.addEventListener('change', (event) => {
            state.showTruth = event.target.checked;

            if (state.showTruth) {
                trailToggleEl.checked = false;
                trailToggleEl.disabled = true;
                trailControlEl.classList.add('cursor-not-allowed', 'opacity-40');
                trailControlEl.classList.remove('cursor-pointer', 'hover:bg-zinc-100');
                trailControlEl.setAttribute('aria-disabled', 'true');
                state.showTrail = false;
                clearTrail();
            } else {
                trailToggleEl.disabled = false;
                trailControlEl.classList.remove('cursor-not-allowed', 'opacity-40');
                trailControlEl.classList.add('cursor-pointer', 'hover:bg-zinc-100');
                trailControlEl.setAttribute('aria-disabled', 'false');
            }
        });

        function animate() {
            // Apply easing to hand coordinates (simulates physical mass/delay of moving a hand)
            state.handX += (state.mouseX - state.handX) * TIPLET_CONFIG.easing;
            state.handY += (state.mouseY - state.handY) * TIPLET_CONFIG.easing;

            // Clear Canvas
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // 1. Draw the Target Stimulus (Ground Truth)
            ctx.save();
            ctx.translate(state.targetX, state.targetY);
            ctx.rotate(state.rotation);

            // Stroke setup - simulate a thick "edge" detected by computer vision
            const strokeWidth = 24;
            ctx.lineWidth = strokeWidth;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            if (state.showTruth) {
                // Subtle wide background stroke (replaces neon glow)
                ctx.strokeStyle = 'rgba(228, 228, 231, 0.8)'; // zinc-200
                ctx.shadowBlur = 0;
                ctx.stroke(currentPath);

                // Solid core line
                ctx.strokeStyle = 'rgba(9, 9, 11, 1)'; // zinc-950
                ctx.lineWidth = 3;
                ctx.stroke(currentPath);
            }

            // Restore context for non-rotated operations
            ctx.restore();

            // 2. Continuous spatiotemporal modulation based on distance to the edge
            let peakIntensity = 0;
            motors.forEach(motor => {
                const globalX = state.handX + motor.dx;
                const globalY = state.handY + motor.dy;
                const targetIntensity = intensityAtPoint(globalX, globalY);

                motor.intensity += (
                    targetIntensity - motor.intensity
                ) * TIPLET_CONFIG.intensitySmoothing;
                drawMotorTrail(motor, globalX, globalY);
                peakIntensity = Math.max(peakIntensity, motor.intensity);
            });

            // Update the aggregate readout and individual motor meters.
            intensityEl.innerText = `${Math.round(peakIntensity * 100)}%`;
            if (peakIntensity > 0.01) {
                intensityEl.classList.add('text-zinc-950');
                intensityEl.classList.remove('text-zinc-400');
            } else {
                intensityEl.classList.remove('text-zinc-950');
                intensityEl.classList.add('text-zinc-400');
            }
            motorLevelEls.forEach((level, index) => {
                level.style.height = `${motors[index].intensity * 100}%`;
            });

            ctx.save();
            ctx.translate(state.handX, state.handY);

            // Draw the "Fingertip / PCB" background
            const boardWidth = TIPLET_CONFIG.spacingX + TIPLET_CONFIG.outlinePadding * 2;
            const boardHeight = (TIPLET_CONFIG.spacingY * 2) + TIPLET_CONFIG.outlinePadding * 2;

            ctx.beginPath();
            ctx.roundRect(-boardWidth/2, -boardHeight/2, boardWidth, boardHeight, 12);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; // white board
            ctx.strokeStyle = 'rgba(228, 228, 231, 1)'; // zinc-200 border
            ctx.lineWidth = 1;
            ctx.fill();
            ctx.stroke();

            // Draw the 6 Motors
            motors.forEach(motor => {
                const intensity = motor.intensity;
                const vibration = TIPLET_CONFIG.vibrationAmplitude * intensity;
                const vibX = (Math.random() - 0.5) * vibration;
                const vibY = (Math.random() - 0.5) * vibration;
                const shade = Math.round(244 - 235 * intensity);

                ctx.save();
                ctx.translate(vibX, vibY);
                ctx.beginPath();
                ctx.arc(
                    motor.dx,
                    motor.dy,
                    TIPLET_CONFIG.dotRadius + intensity,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = `rgb(${shade}, ${shade}, ${Math.min(245, shade + 1)})`;
                ctx.strokeStyle = `rgba(161, 161, 170, ${0.35 + intensity * 0.45})`;
                ctx.lineWidth = 1;
                ctx.shadowColor = `rgba(9, 9, 11, ${intensity * 0.25})`;
                ctx.shadowBlur = intensity * 8;
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            ctx.restore();

            // Loop
            requestAnimationFrame(animate);
        }

        // Initialize setup
        window.onload = () => {
            resizeCanvas();
            currentPath = generatePath();
            animate();
            window.setTimeout(revealHeaderIntensity, 3000);
        };

    </script>
</body>
