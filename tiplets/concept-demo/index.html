<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TipLets Interactive Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling on desktop */
        }

        /* Custom styles for the interactive area */
        #simulation-container {
            position: relative;
            cursor: crosshair;
            background-color: #fafafa; /* zinc-50 equivalent */
            background-image: radial-gradient(#e4e4e7 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Custom toggle switch styling - Shadcn style */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #09090b;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #09090b;
        }

        /* Hide scrollbar for side panel on small screens */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e4e7;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row bg-white text-zinc-950">

    <aside class="w-full md:w-80 bg-white border-b md:border-b-0 md:border-r border-zinc-200 p-6 flex flex-col z-10 overflow-y-auto shrink-0 transition-all">
        <div class="space-y-6 flex-grow">
            <!-- Stimulus Selection -->
            <div>
                <label class="block text-sm font-medium text-zinc-900 mb-2">Target Stimulus</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setShape('square')" id="btn-square" class="shape-btn bg-white text-zinc-900 hover:bg-zinc-100 text-sm py-2 rounded-md border border-zinc-200 transition-colors font-medium focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2">Square</button>
                    <button onclick="setShape('circle')" id="btn-circle" class="shape-btn bg-zinc-900 text-zinc-50 hover:bg-zinc-900/90 text-sm py-2 rounded-md border border-zinc-200 transition-colors font-medium focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2">Circle</button>
                    <button onclick="setShape('triangle')" id="btn-triangle" class="shape-btn bg-white text-zinc-900 hover:bg-zinc-100 text-sm py-2 rounded-md border border-zinc-200 transition-colors font-medium focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2">Triangle</button>
                    <button onclick="setShape('star')" id="btn-star" class="shape-btn bg-white text-zinc-900 hover:bg-zinc-100 text-sm py-2 rounded-md border border-zinc-200 transition-colors font-medium focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2">Star</button>
                </div>
            </div>

            <!-- Ground Truth Toggle -->
            <div class="bg-white p-4 rounded-lg border border-zinc-200 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-medium text-zinc-900">Show Ground Truth</label>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="truth-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 border-zinc-200 appearance-none cursor-pointer transition-all duration-200 ease-in-out z-10" checked/>
                        <label for="truth-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-zinc-200 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                </div>
                <p class="text-xs text-zinc-500">Simulates the visual-tactile translation. Turn off to test your tactile perception.</p>
            </div>

            <!-- Randomize Button -->
            <button onclick="randomizeTransform()" class="w-full bg-white text-zinc-900 border border-zinc-200 hover:bg-zinc-100 font-medium py-2.5 rounded-md shadow-sm transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                Randomize Position
            </button>
        </div>

        <div class="mt-8 border-t border-zinc-200 pt-4">
            <h3 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Status</h3>
            <div class="flex items-center justify-between text-sm">
                <span class="text-zinc-600">Peak Intensity:</span>
                <span id="motor-intensity" class="font-mono text-zinc-400 font-medium">0%</span>
            </div>
            <div class="grid grid-cols-6 gap-1.5 mt-3" aria-label="Individual motor intensity levels">
                <div class="h-8 rounded-sm bg-zinc-100 overflow-hidden flex items-end"><span data-motor-level="1" class="block w-full h-0 bg-zinc-950"></span></div>
                <div class="h-8 rounded-sm bg-zinc-100 overflow-hidden flex items-end"><span data-motor-level="2" class="block w-full h-0 bg-zinc-950"></span></div>
                <div class="h-8 rounded-sm bg-zinc-100 overflow-hidden flex items-end"><span data-motor-level="3" class="block w-full h-0 bg-zinc-950"></span></div>
                <div class="h-8 rounded-sm bg-zinc-100 overflow-hidden flex items-end"><span data-motor-level="4" class="block w-full h-0 bg-zinc-950"></span></div>
                <div class="h-8 rounded-sm bg-zinc-100 overflow-hidden flex items-end"><span data-motor-level="5" class="block w-full h-0 bg-zinc-950"></span></div>
                <div class="h-8 rounded-sm bg-zinc-100 overflow-hidden flex items-end"><span data-motor-level="6" class="block w-full h-0 bg-zinc-950"></span></div>
            </div>
        </div>
    </aside>

    <main id="simulation-container" class="flex-grow relative h-[60vh] md:h-full touch-none">
        <canvas id="env-canvas" class="absolute inset-0 w-full h-full"></canvas>

        <!-- Floating identity island -->
        <header class="absolute top-4 md:top-6 left-1/2 -translate-x-1/2 z-20 w-[calc(100%-2rem)] max-w-xl pointer-events-none">
            <div class="rounded-2xl border border-white/80 ring-1 ring-zinc-200/80 bg-white/90 backdrop-blur-md px-5 py-3.5 shadow-[0_16px_40px_-20px_rgba(9,9,11,0.45)]">
                <div class="flex flex-col sm:flex-row sm:items-center sm:gap-4">
                    <h1 class="text-lg font-semibold tracking-tight text-zinc-950 whitespace-nowrap">TipLets Demo</h1>
                    <span class="hidden sm:block h-7 w-px bg-zinc-200" aria-hidden="true"></span>
                    <p class="mt-0.5 sm:mt-0 text-xs sm:text-sm leading-relaxed text-zinc-500">
                        Move your cursor over the canvas to explore hidden shapes.
                    </p>
                </div>
            </div>
        </header>

        <!-- Instructional Overlay (Fades out on interaction) -->
        <div id="instructions" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-700">
            <div class="bg-white/95 backdrop-blur-sm px-6 py-5 rounded-xl border border-zinc-200 text-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-3 text-zinc-900 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                </svg>
                <p class="font-semibold text-zinc-900">Move cursor to explore</p>
                <p class="text-sm text-zinc-500 mt-1">Touch or mouse</p>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('env-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('simulation-container');
        const intensityEl = document.getElementById('motor-intensity');
        const motorLevelEls = [...document.querySelectorAll('[data-motor-level]')];
        const instructionsEl = document.getElementById('instructions');
        const ISLAND_CLEARANCE = 132;

        // Simulation State
        let state = {
            shape: 'circle',
            showTruth: true,
            hasInteracted: false,
            // Shape transformation data
            targetX: 0,
            targetY: 0,
            scale: 1,
            rotation: 0,
            // Physics / Input
            mouseX: window.innerWidth / 2,
            mouseY: window.innerHeight / 2,
            handX: window.innerWidth / 2,
            handY: window.innerHeight / 2,
        };

        // TipLet Configuration (6 dots, standard Braille layout proportions)
        const TIPLET_CONFIG = {
            dotRadius: 4,
            spacingX: 18,
            spacingY: 22,
            easing: 0.15, // Lower = more "lag" / weight to the hand
            outlinePadding: 16,
            falloffRadius: 28,
            intensitySmoothing: 0.22,
            vibrationAmplitude: 2.5
        };

        // Generate the relative positions of the 6 motors from the center of the fingertip
        const motors = [
            { id: 1, dx: -TIPLET_CONFIG.spacingX/2, dy: -TIPLET_CONFIG.spacingY, intensity: 0 },
            { id: 2, dx: -TIPLET_CONFIG.spacingX/2, dy: 0, intensity: 0 },
            { id: 3, dx: -TIPLET_CONFIG.spacingX/2, dy: TIPLET_CONFIG.spacingY, intensity: 0 },
            { id: 4, dx: TIPLET_CONFIG.spacingX/2,  dy: -TIPLET_CONFIG.spacingY, intensity: 0 },
            { id: 5, dx: TIPLET_CONFIG.spacingX/2,  dy: 0, intensity: 0 },
            { id: 6, dx: TIPLET_CONFIG.spacingX/2,  dy: TIPLET_CONFIG.spacingY, intensity: 0 }
        ];

        let currentPath = new Path2D();

        function resizeCanvas() {
            // High DPI display support for crisp rendering
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            // Center initial stimulus
            if(state.targetX === 0) {
                const initialRadius = 75 * state.scale;
                const preferredY = Math.max(
                    rect.height / 2,
                    ISLAND_CLEARANCE + initialRadius
                );
                const maximumY = rect.height - initialRadius - 24;

                state.targetX = rect.width / 2;
                state.targetY = Math.max(
                    initialRadius,
                    Math.min(preferredY, maximumY)
                );
                state.mouseX = rect.width / 2;
                state.mouseY = state.targetY;
                state.handX = rect.width / 2;
                state.handY = state.targetY;
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // Input Tracking (Mouse & Touch)
        function updateMousePos(x, y) {
            const rect = canvas.getBoundingClientRect();
            state.mouseX = x - rect.left;
            state.mouseY = y - rect.top;

            if (!state.hasInteracted) {
                state.hasInteracted = true;
                instructionsEl.style.opacity = '0';
            }
        }

        container.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
        container.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
            updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        container.addEventListener('mousedown', (e) => updateMousePos(e.clientX, e.clientY));
        container.addEventListener('touchstart', (e) => {
            updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        function getPolygonVertices(shape, baseSize) {
            const halfSize = baseSize / 2;

            if (shape === 'square') {
                return [
                    { x: -halfSize, y: -halfSize },
                    { x: halfSize, y: -halfSize },
                    { x: halfSize, y: halfSize },
                    { x: -halfSize, y: halfSize }
                ];
            }

            if (shape === 'triangle') {
                return [
                    { x: 0, y: -halfSize },
                    { x: halfSize, y: halfSize },
                    { x: -halfSize, y: halfSize }
                ];
            }

            if (shape === 'star') {
                return Array.from({ length: 10 }, (_, index) => {
                    const radius = index % 2 === 0 ? halfSize : halfSize / 2;
                    const angle = -Math.PI / 2 + index * Math.PI / 5;
                    return {
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius
                    };
                });
            }

            return [];
        }

        function generatePath() {
            const path = new Path2D();
            const baseSize = 150 * state.scale; // Size of the object

            // We use math to draw shapes centered at 0,0. We will translate the context when drawing.
            if (state.shape === 'circle') {
                path.arc(0, 0, baseSize / 2, 0, Math.PI * 2);
                return path;
            }

            const vertices = getPolygonVertices(state.shape, baseSize);
            if (vertices.length > 0) {
                path.moveTo(vertices[0].x, vertices[0].y);
                vertices.slice(1).forEach(vertex => path.lineTo(vertex.x, vertex.y));
                path.closePath();
            }

            return path;
        }

        function pointToSegmentDistance(point, start, end) {
            const segmentX = end.x - start.x;
            const segmentY = end.y - start.y;
            const lengthSquared = segmentX * segmentX + segmentY * segmentY;

            if (lengthSquared === 0) {
                return Math.hypot(point.x - start.x, point.y - start.y);
            }

            const projection = (
                (point.x - start.x) * segmentX +
                (point.y - start.y) * segmentY
            ) / lengthSquared;
            const t = Math.max(0, Math.min(1, projection));
            const closestX = start.x + segmentX * t;
            const closestY = start.y + segmentY * t;

            return Math.hypot(point.x - closestX, point.y - closestY);
        }

        function distanceToShapeEdge(globalX, globalY) {
            const offsetX = globalX - state.targetX;
            const offsetY = globalY - state.targetY;
            const cos = Math.cos(state.rotation);
            const sin = Math.sin(state.rotation);
            const localPoint = {
                x: offsetX * cos + offsetY * sin,
                y: -offsetX * sin + offsetY * cos
            };
            const baseSize = 150 * state.scale;

            if (state.shape === 'circle') {
                return Math.abs(Math.hypot(localPoint.x, localPoint.y) - baseSize / 2);
            }

            const vertices = getPolygonVertices(state.shape, baseSize);
            return vertices.reduce((closestDistance, vertex, index) => {
                const nextVertex = vertices[(index + 1) % vertices.length];
                return Math.min(
                    closestDistance,
                    pointToSegmentDistance(localPoint, vertex, nextVertex)
                );
            }, Infinity);
        }

        function intensityAtPoint(globalX, globalY) {
            const distance = distanceToShapeEdge(globalX, globalY);
            const proximity = Math.max(0, 1 - distance / TIPLET_CONFIG.falloffRadius);

            // Smoothstep produces a gentle physical ramp at both ends of the range.
            return proximity * proximity * (3 - 2 * proximity);
        }

        function setShape(shapeName) {
            state.shape = shapeName;

            // Update UI buttons - Shadcn Styling
            document.querySelectorAll('.shape-btn').forEach(btn => {
                btn.classList.remove('bg-zinc-900', 'text-zinc-50', 'hover:bg-zinc-900/90');
                btn.classList.add('bg-white', 'text-zinc-900', 'hover:bg-zinc-100');
            });
            const activeBtn = document.getElementById(`btn-${shapeName}`);
            activeBtn.classList.remove('bg-white', 'text-zinc-900', 'hover:bg-zinc-100');
            activeBtn.classList.add('bg-zinc-900', 'text-zinc-50', 'hover:bg-zinc-900/90');

            currentPath = generatePath();
        }

        function randomizeTransform() {
            const rect = container.getBoundingClientRect();
            // Keep it somewhat within bounds
            const padding = 150;
            state.scale = 0.7 + Math.random() * 0.8; // Scale between 0.7 and 1.5
            const shapeRadius = 75 * state.scale;
            const minimumY = Math.max(padding, ISLAND_CLEARANCE + shapeRadius);
            const maximumY = rect.height - shapeRadius - 24;

            state.targetX = padding + Math.random() * (rect.width - padding * 2);
            state.targetY = minimumY < maximumY
                ? minimumY + Math.random() * (maximumY - minimumY)
                : Math.max(shapeRadius, maximumY);
            state.rotation = (Math.random() - 0.5) * Math.PI; // Random rotation

            currentPath = generatePath();
        }

        document.getElementById('truth-toggle').addEventListener('change', (e) => {
            state.showTruth = e.target.checked;
        });

        function animate() {
            // Apply easing to hand coordinates (simulates physical mass/delay of moving a hand)
            state.handX += (state.mouseX - state.handX) * TIPLET_CONFIG.easing;
            state.handY += (state.mouseY - state.handY) * TIPLET_CONFIG.easing;

            // Clear Canvas
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // 1. Draw the Target Stimulus (Ground Truth)
            ctx.save();
            ctx.translate(state.targetX, state.targetY);
            ctx.rotate(state.rotation);

            // Stroke setup - simulate a thick "edge" detected by computer vision
            const strokeWidth = 24;
            ctx.lineWidth = strokeWidth;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            if (state.showTruth) {
                // Subtle wide background stroke (replaces neon glow)
                ctx.strokeStyle = 'rgba(228, 228, 231, 0.8)'; // zinc-200
                ctx.shadowBlur = 0;
                ctx.stroke(currentPath);

                // Solid core line
                ctx.strokeStyle = 'rgba(9, 9, 11, 1)'; // zinc-950
                ctx.lineWidth = 3;
                ctx.stroke(currentPath);
            }

            // Restore context for non-rotated operations
            ctx.restore();

            // 2. Continuous spatiotemporal modulation based on distance to the edge
            let peakIntensity = 0;
            motors.forEach(motor => {
                const globalX = state.handX + motor.dx;
                const globalY = state.handY + motor.dy;
                const targetIntensity = intensityAtPoint(globalX, globalY);

                motor.intensity += (
                    targetIntensity - motor.intensity
                ) * TIPLET_CONFIG.intensitySmoothing;
                peakIntensity = Math.max(peakIntensity, motor.intensity);
            });

            // Update the aggregate readout and individual motor meters.
            intensityEl.innerText = `${Math.round(peakIntensity * 100)}%`;
            if (peakIntensity > 0.01) {
                intensityEl.classList.add('text-zinc-950');
                intensityEl.classList.remove('text-zinc-400');
            } else {
                intensityEl.classList.remove('text-zinc-950');
                intensityEl.classList.add('text-zinc-400');
            }
            motorLevelEls.forEach((level, index) => {
                level.style.height = `${motors[index].intensity * 100}%`;
            });

            ctx.save();
            ctx.translate(state.handX, state.handY);

            // Draw the "Fingertip / PCB" background
            const boardWidth = TIPLET_CONFIG.spacingX + TIPLET_CONFIG.outlinePadding * 2;
            const boardHeight = (TIPLET_CONFIG.spacingY * 2) + TIPLET_CONFIG.outlinePadding * 2;

            ctx.beginPath();
            ctx.roundRect(-boardWidth/2, -boardHeight/2, boardWidth, boardHeight, 12);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; // white board
            ctx.strokeStyle = 'rgba(228, 228, 231, 1)'; // zinc-200 border
            ctx.lineWidth = 1;
            ctx.fill();
            ctx.stroke();

            // Draw the 6 Motors
            motors.forEach(motor => {
                const intensity = motor.intensity;
                const vibration = TIPLET_CONFIG.vibrationAmplitude * intensity;
                const vibX = (Math.random() - 0.5) * vibration;
                const vibY = (Math.random() - 0.5) * vibration;
                const shade = Math.round(244 - 235 * intensity);

                ctx.save();
                ctx.translate(vibX, vibY);
                ctx.beginPath();
                ctx.arc(
                    motor.dx,
                    motor.dy,
                    TIPLET_CONFIG.dotRadius + intensity,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = `rgb(${shade}, ${shade}, ${Math.min(245, shade + 1)})`;
                ctx.strokeStyle = `rgba(161, 161, 170, ${0.35 + intensity * 0.45})`;
                ctx.lineWidth = 1;
                ctx.shadowColor = `rgba(9, 9, 11, ${intensity * 0.25})`;
                ctx.shadowBlur = intensity * 8;
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            ctx.restore();

            // Loop
            requestAnimationFrame(animate);
        }

        // Initialize setup
        window.onload = () => {
            resizeCanvas();
            currentPath = generatePath();
            animate();
        };

    </script>
</body>
</html>
